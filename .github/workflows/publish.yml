name: Video Auto-Publisher

on:
  workflow_dispatch:

concurrency:
  group: video-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Afficher heure serveur
        run: date

      - name: Lancer le script de publication image
        if: always()
        env:
          NOTION_TOKEN:             ${{ secrets.NOTION_TOKEN }}
          NOTION_IMAGE_DATABASE_ID: ${{ secrets.NOTION_IMAGE_DATABASE_ID }}
          UPLOAD_POST_API_KEY:      ${{ secrets.UPLOAD_POST_API_KEY }}
          PUBLISH_SLOT_LOCK_FILE:   ${{ runner.temp }}/publish-slot-lock.json
        run: python publish_images.py

      - name: Installer Tesseract OCR et espeak-ng
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr espeak-ng

      - name: Generer HyperFrames TeacherRyan pilote
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_TTS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON }}
          HYPERFRAMES_OUTPUT_DIR: ${{ runner.temp }}/hyperframes-output
          HYPERFRAMES_UPLOAD_DRIVE: "0"
        run: python hyperframes/scripts/run_pilot.py --execute

      - name: Sauvegarder les videos HyperFrames finales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-final-videos
          path: ${{ runner.temp }}/hyperframes-output/*.mp4
          if-no-files-found: ignore
          retention-days: 1

      - name: Lancer le script de publication video
        if: always()
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:  ${{ secrets.NOTION_DATABASE_ID }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          HYPERFRAMES_OUTPUT_DIR: ${{ runner.temp }}/hyperframes-output
          PUBLISH_SLOT_LOCK_FILE: ${{ runner.temp }}/publish-slot-lock.json
        run: python publish.py
