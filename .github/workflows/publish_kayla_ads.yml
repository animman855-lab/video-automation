name: Kayla Ads Publisher

on:
  workflow_dispatch:

concurrency:
  group: kayla-ads-publisher
  cancel-in-progress: false

jobs:
  publish-kayla-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kayla-whisper-base-v1

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Afficher heure serveur
        run: date

      - name: Preparer video Flow Kayla avec HyperFrames
        continue-on-error: true
        env:
          NOTION_TOKEN:                 ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:           ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_CLIENT_ID:             ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:         ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:         ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID:       ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          KAYLA_AUTO_SUBTITLES:         "1"
          KAYLA_WHISPER_MODEL:          "base"
        run: python hyperframes/scripts/run_kayla_postprocess.py --execute

      - name: Publier une video Kayla Ads
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:  ${{ secrets.NOTION_DATABASE_ID }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
        run: python publish_kayla_ads.py
