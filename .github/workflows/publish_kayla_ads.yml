name: Kayla Ads Publisher

on:
  workflow_dispatch:

concurrency:
  group: kayla-ads-publisher
  cancel-in-progress: false

jobs:
  publish-kayla-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kayla-whisper-base-v1

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Afficher heure serveur
        run: date

      - name: Preparer video Flow Kayla avec HyperFrames
        continue-on-error: true
        env:
          NOTION_TOKEN:                 ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:           ${{ secrets.NOTION_DATABASE_ID }}
          KAYLA_AUTO_SUBTITLES:         "1"
          KAYLA_WHISPER_MODEL:          "base"
          KAYLA_OUTPUT_DIR:             "${{ runner.temp }}/kayla-output"
          KAYLA_UPLOAD_DRIVE:           "0"
        run: python hyperframes/scripts/run_kayla_postprocess.py --execute

      - name: Sauvegarder la video Kayla finale
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kayla-final-video
          path: ${{ runner.temp }}/kayla-output/*.mp4
          if-no-files-found: ignore
          retention-days: 1

      - name: Publier une video Kayla Ads
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:  ${{ secrets.NOTION_DATABASE_ID }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          KAYLA_OUTPUT_DIR:    "${{ runner.temp }}/kayla-output"
        run: python publish_kayla_ads.py
